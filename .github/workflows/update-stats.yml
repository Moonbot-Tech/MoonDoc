name: Update Moonbot Public Stats

on:
  schedule:
    # Every Monday at 06:00 UTC and on the 1st of every month at 06:15 UTC
    - cron: '0 6 * * 1'
    - cron: '15 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pull latest stats from stat.moonbot.pro and render SVG
        run: python3 scripts/update_stats.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-current-month.svg stats/ README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(stats): update Moonbot monthly stats and daily P&L chart"
            git push
          fi
